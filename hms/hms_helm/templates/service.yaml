apiVersion: v1
kind: Service
metadata:
  name: {{ include "hms_helm.fullname" . }}
  labels:
    {{- include "hms_helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9083
      protocol: TCP
      name: hms
  selector:
    {{- include "hms_helm.selectorLabels" . | nindent 4 }}