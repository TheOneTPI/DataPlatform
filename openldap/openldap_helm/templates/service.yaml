apiVersion: v1
kind: Service
metadata:
  name: {{ include "openldap_helm.fullname" . }}
  labels:
    {{- include "openldap_helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- with (index .Values.service.ports 0) }}
    - port: {{ .port }}
      targetPort: ldap
      protocol: TCP
      name: ldap
    {{- end }}
    {{- with (index .Values.service.ports 1) }}
    - port: {{ .port }}
      targetPort: ldaps
      protocol: TCP
      name: ldaps
    {{- end }}
  selector:
    {{- include "openldap_helm.selectorLabels" . | nindent 4 }}